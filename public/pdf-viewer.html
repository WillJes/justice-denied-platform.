<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <title>Justice Denied Archive</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto 1fr;background:#2b2b2b;font-family:Arial,sans-serif}
    header{display:flex;align-items:center;gap:14px;min-height:64px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#11100e;color:#f4eddf;box-shadow:0 2px 12px #0008;z-index:2}
    button{border:1px solid #ffffff55;border-radius:999px;background:#b42217;color:#fff;padding:10px 16px;font:700 14px Arial,sans-serif;white-space:nowrap;cursor:pointer}
    div{min-width:0}strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:#d7cdbd}
    iframe{width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <header>
    <button type="button" id="back">← Back</button>
    <div><strong id="title">Public Archive</strong><small>Justice Denied</small></div>
  </header>
  <iframe id="pdf" title="Justice Denied public archive PDF"></iframe>
  <script>
    const params=new URLSearchParams(location.search);
    const file=params.get("file")||"";
    const title=params.get("title")||"Public Archive";
    document.getElementById("title").textContent=title;
    document.title=title+" | Justice Denied";
    if(file.startsWith("/archive/")&&file.toLowerCase().endsWith(".pdf")){
      document.getElementById("pdf").src=file;
    }else{
      location.replace("/#archive");
    }
    document.getElementById("back").addEventListener("click",()=>{
      if(history.length>1) history.back(); else location.href="/#archive";
    });
  </script>
</body>
</html>
